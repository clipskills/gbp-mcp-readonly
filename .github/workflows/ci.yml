name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile check
        run: python -m py_compile mcp_server.py data_fetcher.py drive_helper.py health_check.py
      - name: Lint
        run: ruff check src tests mcp_server.py
      - name: Tests
        run: pytest
      - name: Entrypoint help
        run: python mcp_server.py --help
